<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>وَفِّرْهَا صَحّ</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Cairo Arabic Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <style>

    /* =====================================================
       DESIGN SYSTEM
    ===================================================== */

    :root {

      --primary: #5B35D5;
      --primary-light: #F0ECFF;

      --orange: #FF7A1A;
      --orange-light: #FFF1E6;

      --green: #12A87D;
      --green-dark: #0D936D;

      --background: #F8F8FC;

      --white: #FFFFFF;

      --text: #252337;
      --text-light: #77758A;
      --muted: #A3A1B0;

      --border: #ECECF3;

      --shadow:
        0 8px 25px rgba(35, 32, 70, 0.07);

      --radius: 18px;

    }


    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;

      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {

      font-family: "Cairo", sans-serif;

      background: var(--background);

      color: var(--text);

      min-height: 100vh;

      -webkit-font-smoothing: antialiased;

      text-rendering: optimizeLegibility;
    }

    button,
    a {
      font-family: inherit;
    }

    button {
      border: 0;
    }


    /* =====================================================
       MAIN CONTAINER
    ===================================================== */

    .app-container {

      width: 100%;

      max-width: 720px;

      margin: 0 auto;

    }


    /* =====================================================
       HEADER
    ===================================================== */

    .top-header {

      position: relative;

      width: 100%;

      background:
        linear-gradient(
          135deg,
          #5631CB 0%,
          #6639D9 50%,
          #7644E4 100%
        );

      color: #FFFFFF;

      padding: 21px 18px 24px;

      text-align: center;

      overflow: hidden;

    }


    .top-header::before {

      content: "";

      position: absolute;

      width: 150px;
      height: 150px;

      border-radius: 50%;

      background:
        rgba(255,255,255,0.07);

      top: -85px;

      right: -45px;

    }


    .top-header::after {

      content: "";

      position: absolute;

      width: 110px;
      height: 110px;

      border-radius: 50%;

      background:
        rgba(255,255,255,0.05);

      bottom: -65px;

      left: -30px;

    }


    .brand {

      position: relative;

      z-index: 2;

      font-size: 27px;

      line-height: 1.3;

      font-weight: 800;

      letter-spacing: -0.4px;

    }


    .brand-subtitle {

      position: relative;

      z-index: 2;

      margin-top: 4px;

      font-size: 12px;

      font-weight: 500;

      opacity: .88;

    }


    /* =====================================================
       HOME
    ===================================================== */

    #home {

      display: block;

      padding-bottom: 28px;

    }


    /* =====================================================
       SECTION INTRO
    ===================================================== */

    .section-intro {

      text-align: center;

      padding:

        20px
        18px
        9px;

    }


    .section-title {

      font-size: 19px;

      line-height: 1.5;

      font-weight: 800;

      color: var(--text);

    }


    .section-description {

      margin-top: 3px;

      color: var(--text-light);

      font-size: 12px;

      font-weight: 500;

    }


    /* =====================================================
       CATEGORIES
    ===================================================== */

    .categories {

      width:
        calc(100% - 28px);

      max-width: 680px;

      margin:
        8px auto 0;

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 11px;

    }


    /* =====================================================
       CATEGORY CARD
    ===================================================== */

    .category {

      display: flex;

      align-items: center;

      gap: 10px;

      width: 100%;

      min-height: 70px;

      padding: 10px 12px;

      background: var(--white);

      border: 1px solid var(--border);

      border-radius: 17px;

      color: var(--text);

      text-align: right;

      cursor: pointer;

      box-shadow:
        0 5px 17px
        rgba(35,32,70,.045);

      transition:
        transform .15s ease,
        box-shadow .15s ease;

    }


    .category:active {

      transform:
        scale(.975);

      box-shadow:
        0 3px 10px
        rgba(35,32,70,.07);

    }


    /* =====================================================
       CATEGORY ICON
    ===================================================== */

    .category-icon {

      width: 43px;

      height: 43px;

      min-width: 43px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 13px;

      font-size: 21px;

      background:
        var(--primary-light);

    }


    /* Individual category colors */

    .category:nth-child(1)
    .category-icon {

      background: #EAF3FF;

    }


    .category:nth-child(2)
    .category-icon {

      background: #FFF0F5;

    }


    .category:nth-child(3)
    .category-icon {

      background: #F1ECFF;

    }


    .category:nth-child(4)
    .category-icon {

      background: #FFF5E8;

    }


    .category:nth-child(5)
    .category-icon {

      background: #EEF1F7;

    }


    .category:nth-child(6)
    .category-icon {

      background: #E9F5FF;

    }


    .category:nth-child(7)
    .category-icon {

      background: #EAF8F1;

    }


    .category:nth-child(8)
    .category-icon {

      background: var(--orange-light);

    }


    /* =====================================================
       CATEGORY NAME
    ===================================================== */

    .category-name {

      font-size: 14px;

      line-height: 1.4;

      font-weight: 700;

      color: var(--text);

    }


    /* =====================================================
       DEALS BANNER
    ===================================================== */

    .deals-banner {

      position: relative;

      display: flex;

      align-items: center;

      justify-content: space-between;

      width:
        calc(100% - 28px);

      max-width: 680px;

      min-height: 76px;

      margin:
        16px auto 0;

      padding:
        12px 15px;

      border-radius: 18px;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #FF8A24,
          #FF6A35
        );

      color: #FFFFFF;

      cursor: pointer;

      box-shadow:
        0 9px 23px
        rgba(255,105,45,.18);

      transition:
        transform .15s ease;

    }


    .deals-banner:active {

      transform:
        scale(.985);

    }


    .deals-banner::before {

      content: "";

      position: absolute;

      width: 120px;
      height: 120px;

      border-radius: 50%;

      background:
        rgba(255,255,255,.09);

      left: -50px;

      bottom: -72px;

    }


    .deals-content {

      position: relative;

      z-index: 2;

      text-align: right;

    }


    .deals-small {

      font-size: 10px;

      font-weight: 600;

      opacity: .9;

    }


    .deals-title {

      margin-top: 1px;

      font-size: 17px;

      line-height: 1.5;

      font-weight: 800;

    }


    .deals-icon {

      position: relative;

      z-index: 2;

      width: 45px;

      height: 45px;

      min-width: 45px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 14px;

      background:
        rgba(255,255,255,.18);

      font-size: 22px;

    }


    /* =====================================================
       PRODUCTS PAGE
    ===================================================== */

    #products {

      display: none;

      min-height: 100vh;

      padding-bottom: 35px;

    }


    #products.active {

      display: block;

    }


    /* =====================================================
       PRODUCT HEADER
    ===================================================== */

    .products-header {

      display: flex;

      align-items: center;

      gap: 10px;

      width:
        calc(100% - 28px);

      max-width: 680px;

      margin: 0 auto;

      padding:
        16px 0 11px;

    }


    .back {

      width: 41px;

      height: 41px;

      min-width: 41px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 12px;

      background: #FFFFFF;

      border: 1px solid var(--border);

      color: var(--text);

      font-size: 20px;

      cursor: pointer;

      box-shadow:
        0 4px 13px
        rgba(35,32,70,.05);

    }


    .products-title-wrap {

      flex: 1;

    }


    #categoryTitle {

      font-size: 20px;

      line-height: 1.4;

      font-weight: 800;

      color: var(--text);

    }


    .products-count {

      margin-top: 1px;

      color: var(--text-light);

      font-size: 11px;

      font-weight: 500;

    }


    /* =====================================================
       PRODUCT LIST
    ===================================================== */

    #productList {

      width: 100%;

      padding-top: 4px;

    }


    /* =====================================================
       PRODUCT CARD
    ===================================================== */

    .product {

      width:
        calc(100% - 32px);

      max-width: 390px;

      margin:
        0 auto 22px;

      background:
        var(--white);

      border:
        1px solid var(--border);

      border-radius: 21px;

      overflow: hidden;

      box-shadow:
        0 9px 28px
        rgba(35,32,70,.075);

    }


    /* =====================================================
       PRODUCT IMAGE
       مربع ومتصلة مباشرة بالبطاقة
    ===================================================== */

    .product-image {

      position: relative;

      width: 100%;

      aspect-ratio: 1 / 1;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #FFFFFF;

      overflow: hidden;

    }


    .product-image img {

      width: 100%;

      height: 100%;

      display: block;

      object-fit: cover;

      padding: 0;

    }


    /* =====================================================
       PRODUCT BADGE
    ===================================================== */

    .discount {

      position: absolute;

      top: 12px;

      right: 12px;

      z-index: 3;

      padding:
        5px 9px;

      border-radius: 8px;

      background:
        #FF5A54;

      color:
        #FFFFFF;

      font-size: 10px;

      font-weight: 700;

      box-shadow:
        0 3px 9px
        rgba(255,90,84,.18);

    }


    /* =====================================================
       PRODUCT INFO
    ===================================================== */

    .product-info {

      padding:
        15px 16px 17px;

      background:
        #FFFFFF;

    }


    /* =====================================================
       PRODUCT TITLE
    ===================================================== */

    .product-title {

      color:
        var(--text);

      font-size:
        17px;

      line-height:
        1.6;

      font-weight:
        700;

      margin-bottom:
        9px;

    }


    /* =====================================================
       PRICE
    ===================================================== */

    .price-row {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        10px;

      margin-bottom:
        12px;

    }


    .current-price {

      display:
        flex;

      align-items:
        baseline;

      gap:
        4px;

      color:
        #E54848;

    }


    .price-number {

      font-size:
        26px;

      line-height:
        1;

      font-weight:
        800;

    }


    .price-currency {

      font-size:
        12px;

      font-weight:
        700;

    }


    .old-price {

      color:
        #9D9BA8;

      font-size:
        13px;

      font-weight:
        500;

      text-decoration:
        line-through;

    }


    /* =====================================================
       BUY BUTTON
    ===================================================== */

    .buy {

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        7px;

      width:
        100%;

      min-height:
        50px;

      border-radius:
        13px;

      background:
        linear-gradient(
          135deg,
          var(--green),
          var(--green-dark)
        );

      color:
        #FFFFFF;

      text-decoration:
        none;

      font-size:
        16px;

      font-weight:
        800;

      box-shadow:
        0 6px 16px
        rgba(18,168,125,.16);

      transition:
        transform .15s ease;

    }


    .buy:active {

      transform:
        scale(.98);

    }


    .buy-icon {

      font-size:
        18px;

    }


    /* =====================================================
       EMPTY CATEGORY
    ===================================================== */

    .empty {

      width:
        calc(100% - 32px);

      max-width:
        390px;

      margin:
        35px auto;

      padding:
        32px 20px;

      text-align:
        center;

      background:
        #FFFFFF;

      border:
        1px solid var(--border);

      border-radius:
        20px;

      box-shadow:
        0 7px 22px
        rgba(30,30,60,.05);

    }


    .empty-icon {

      font-size:
        35px;

      margin-bottom:
        9px;

    }


    .empty-title {

      color:
        var(--text);

      font-size:
        15px;

      font-weight:
        700;

    }


    .empty-text {

      color:
        var(--text-light);

      font-size:
        12px;

      margin-top:
        4px;

    }


    /* =====================================================
       TABLET / DESKTOP
    ===================================================== */

    @media (min-width: 700px) {

      .categories {

        grid-template-columns:
          repeat(4, 1fr);

      }

      .category {

        min-height:
          72px;

      }

      .product {

        max-width:
          390px;

      }

    }


    /* =====================================================
       SMALL PHONES
    ===================================================== */

    @media (max-width: 380px) {

      .brand {

        font-size:
          25px;

      }

      .section-title {

        font-size:
          18px;

      }

      .category {

        min-height:
          66px;

        padding:
          9px;

      }

      .category-icon {

        width:
          39px;

        height:
          39px;

        min-width:
          39px;

        font-size:
          19px;

      }

      .category-name {

        font-size:
          13px;

      }

      .product {

        width:
          calc(100% - 24px);

        border-radius:
          19px;

      }

      .product-title {

        font-size:
          16px;

      }

      .price-number {

        font-size:
          25px;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       HOME
  ===================================================== -->

  <div id="home">

    <div class="app-container">


      <!-- HEADER -->

      <header class="top-header">

        <div class="brand">
          🔥 وَفِّرْهَا صَحّ
        </div>

        <div class="brand-subtitle">
          عروض مختارة بعناية وأسعار تستاهل
        </div>

      </header>


      <!-- SECTION INTRO -->

      <section class="section-intro">

        <div class="section-title">
          تصفّح الأقسام
        </div>

        <div class="section-description">
          اختر القسم الذي يناسبك
        </div>

      </section>


      <!-- CATEGORIES -->

      <div class="categories">


        <button
          class="category"
          onclick="showCategory('shoes')"
        >

          <span class="category-icon">
            👟
          </span>

          <span class="category-name">
            الأحذية
          </span>

        </button>


        <button
          class="category"
          onclick="showCategory('dresses')"
        >

          <span class="category-icon">
            👗
          </span>

          <span class="category-name">
            الفساتين
          </span>

        </button>


        <button
          class="category"
          onclick="showCategory('accessories')"
        >

          <span class="category-icon">
            💍
          </span>

          <span class="category-name">
            الإكسسوارات
          </span>

        </button>


        <button
          class="category"
          onclick="showCategory('bags')"
        >

          <span class="category-icon">
  <img src="bags.jpg" alt="الشنط">
</span>

          <span class="category-name">
            الشنط
          </span>

        </button>


        <button
          class="category"
          onclick="showCategory('watches')"
        >

          <span class="category-icon">
            ⌚
          </span>

          <span class="category-name">
            الساعات
          </span>

        </button>


        <button
          class="category"
          onclick="showCategory('electronics')"
        >

          <span class="category-icon">
            📱
          </span>

          <span class="category-name">
            الإلكترونيات
          </span>

        </button>


        <button
          class="category"
          onclick="showCategory('home')"
        >

          <span class="category-icon">
            🏠
          </span>

          <span class="category-name">
            المنزل
          </span>

        </button>


        <button
          class="category"
          onclick="showCategory('deals')"
        >

          <span class="category-icon">
            🔥
          </span>

          <span class="category-name">
            أقوى العروض
          </span>

        </button>


      </div>


      <!-- DEALS BANNER -->

      <button
        class="deals-banner"
        onclick="showCategory('deals')"
      >

        <div class="deals-content">

          <div class="deals-small">
            عروض تستاهل
          </div>

          <div class="deals-title">
            🔥 أقوى العروض اليوم
          </div>

        </div>


        <div class="deals-icon">
          ⚡
        </div>

      </button>


    </div>

  </div>



  <!-- =====================================================
       PRODUCTS PAGE
  ===================================================== -->

  <div id="products">

    <div class="app-container">


      <!-- PRODUCTS HEADER -->

      <div class="products-header">


        <button
          class="back"
          onclick="goHome()"
          aria-label="رجوع"
        >
          ←
        </button>


        <div class="products-title-wrap">

          <h2 id="categoryTitle">
          </h2>

          <div
            id="productsCount"
            class="products-count"
          >
          </div>

        </div>


      </div>


      <!-- PRODUCT LIST -->

      <div id="productList">
      </div>


    </div>

  </div>



  <!-- =====================================================
       JAVASCRIPT
  ===================================================== -->

  <script>


    /* =====================================================
       PRODUCTS
    ===================================================== */

    const products = {


      bags: [

        {

          title:
            "طقم حقائب نسائية مكون من 3 قطع",

          price:
            "4.36",

          old:
            "261.99",

          image:
            "التقاط.JPG",

          link:
            "https://temu.to/k/eygm0ev5vxz"

        }

      ],


      shoes: [],

      dresses: [],

      accessories: [],

      watches: [],

      electronics: [],

      home: [],

      deals: []

    };


    /* =====================================================
       CATEGORY NAMES
    ===================================================== */

    const categoryNames = {

      shoes:
        "👟 الأحذية",

      dresses:
        "👗 الفساتين",

      accessories:
        "💍 الإكسسوارات",

      bags:
        "👜 الشنط",

      watches:
        "⌚ الساعات",

      electronics:
        "📱 الإلكترونيات",

      home:
        "🏠 المنزل",

      deals:
        "🔥 أقوى العروض"

    };


    /* =====================================================
       SHOW CATEGORY
    ===================================================== */

    function showCategory(category) {


      document
        .getElementById("home")
        .style.display = "none";


      document
        .getElementById("products")
        .classList.add("active");


      document
        .getElementById("categoryTitle")
        .textContent =
        categoryNames[category];


      const items =
        products[category] || [];


      const count =
        document.getElementById(
          "productsCount"
        );


      if (items.length === 1) {

        count.textContent =
          "منتج واحد";

      }

      else if (items.length > 1) {

        count.textContent =
          `${items.length} منتجات`;

      }

      else {

        count.textContent =
          "لا توجد منتجات حاليًا";

      }


      const productList =
        document.getElementById(
          "productList"
        );


      productList.innerHTML = "";


      /* =================================================
         EMPTY CATEGORY
      ================================================= */

      if (items.length === 0) {


        productList.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              🛍️
            </div>

            <div class="empty-title">
              لا توجد منتجات هنا حاليًا
            </div>

            <div class="empty-text">
              نضيف منتجات وعروض جديدة باستمرار
            </div>

          </div>

        `;


        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });


        return;

      }


      /* =================================================
         PRODUCTS
      ================================================= */

      items.forEach(product => {


        productList.innerHTML += `

          <article class="product">


            <!-- PRODUCT IMAGE -->

            <div class="product-image">


              <div class="discount">
                عرض مميز
              </div>


              <img
                src="${product.image}"
                alt="${product.title}"
              >


            </div>


            <!-- PRODUCT INFORMATION -->

            <div class="product-info">


              <div class="product-title">
                ${product.title}
              </div>


              <!-- PRICE -->

              <div class="price-row">


                <div class="current-price">

                  <span class="price-number">
                    ${product.price}
                  </span>

                  <span class="price-currency">
                    ر.س
                  </span>

                </div>


                <div class="old-price">
                  ${product.old} ر.س
                </div>


              </div>


              <!-- BUY -->

              <a
                class="buy"
                href="${product.link}"
                target="_blank"
                rel="noopener noreferrer"
              >

                <span class="buy-icon">
                  🛒
                </span>

                اشترِ الآن

              </a>


            </div>


          </article>

        `;

      });


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =====================================================
       GO HOME
    ===================================================== */

    function goHome() {


      document
        .getElementById("products")
        .classList.remove("active");


      document
        .getElementById("home")
        .style.display = "block";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =====================================================
       TELEGRAM MINI APP
    ===================================================== */

    if (
      window.Telegram &&
      Telegram.WebApp
    ) {

      Telegram.WebApp.ready();
