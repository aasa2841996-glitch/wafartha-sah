<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>وَفِّرْهَا صَحّ</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #f7f7fb;
  color: #252337;
  font-family: "Cairo", sans-serif;
}

button,
a {
  font-family: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

a {
  text-decoration: none;
}

.app {
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 720px;
  margin: auto;
  padding: 0 16px 35px;
}


/* =========================
   HEADER
========================= */

.header {
  background: linear-gradient(135deg, #5b35d5, #7047e8, #815bf0);
  color: white;
  padding: 25px 18px 28px;
  border-radius: 0 0 28px 28px;
  box-shadow: 0 10px 30px rgba(91,53,213,.20);
  overflow: hidden;
  position: relative;
}

.header::before {
  content: "";
  position: absolute;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
  top: -90px;
  left: -50px;
}

.header::after {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: rgba(255,255,255,.07);
  bottom: -100px;
  right: -30px;
}

.header-content {
  position: relative;
  z-index: 2;
  text-align: center;
}

.brand {
  margin: 0;
  font-size: 27px;
  font-weight: 900;
}

.tagline {
  margin: 6px 0 0;
  font-size: 13px;
  opacity: .92;
}


/* =========================
   SECTION
========================= */

.section-heading {
  padding: 25px 4px 14px;
}

.section-heading h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 900;
}

.section-heading p {
  margin: 4px 0 0;
  color: #8d8a9d;
  font-size: 12px;
}


/* =========================
   CATEGORIES
========================= */

.categories {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 13px;
}

.category {
  padding: 0;
  background: white;
  border: 1px solid #ebeaf1;
  border-radius: 21px;
  overflow: hidden;
  box-shadow: 0 7px 22px rgba(35,31,62,.07);
  text-align: right;
  transition: transform .15s ease;
}

.category:active {
  transform: scale(.98);
}


/*
  هنا يتم إخفاء الجزء السفلي من الصور
  الذي يحتوي على اسم القسم داخل الصورة
*/

.category-image {
  width: 100%;
  height: 108px;
  overflow: hidden;
  background: #f3f3f7;
  position: relative;
}

.category-image img {
  width: 100%;
  height: 145%;
  display: block;
  object-fit: cover;
  object-position: center top;
}


.category-bottom {
  min-height: 48px;
  padding: 7px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: white;
}

.category-name {
  font-size: 13px;
  font-weight: 900;
  color: #28243b;
}

.category-arrow {
  width: 27px;
  height: 27px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f0edff;
  color: #5b35d5;
  font-size: 18px;
  font-weight: 900;
}


/* =========================
   DEALS
========================= */

.deals-banner {
  margin-top: 15px;
  min-height: 108px;
  padding: 20px;
  border-radius: 22px;
  background: linear-gradient(135deg,#ff7a1a,#ff4535);
  color: white;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(255,85,35,.20);
}

.deals-banner::before {
  content: "";
  position: absolute;
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: rgba(255,255,255,.10);
  left: -50px;
  top: -75px;
}

.deals-title {
  position: relative;
  z-index: 2;
  font-size: 19px;
  font-weight: 900;
}

.deals-text {
  position: relative;
  z-index: 2;
  font-size: 11px;
  margin-top: 3px;
}

.deals-button {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  background: white;
  color: #f0522f;
  padding: 9px 13px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 900;
}


/* =========================
   PAGES
========================= */

.page {
  display: none;
}

.page.active {
  display: block;
}


/* =========================
   PRODUCTS HEADER
========================= */

.products-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 21px 2px 15px;
}

.back-button {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border-radius: 13px;
  background: white;
  color: #5b35d5;
  border: 1px solid #ebeaf1;
  box-shadow: 0 5px 15px rgba(35,31,62,.06);
  font-size: 22px;
  font-weight: 900;
}

.products-heading {
  flex: 1;
}

.products-heading h2 {
  margin: 0;
  font-size: 19px;
  font-weight: 900;
}

.products-heading p {
  margin: 2px 0 0;
  color: #9491a1;
  font-size: 11px;
}


/* =========================
   PRODUCT
========================= */

.products-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.product {
  width: 100%;
  background: white;
  border-radius: 22px;
  overflow: hidden;
  border: 1px solid #ebeaf1;
  box-shadow: 0 8px 28px rgba(32,32,65,.08);
}

.product-image {
  position: relative;
  width: 100%;
  height: 270px;
  background: #fafafd;
  overflow: hidden;
}

.product-image img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  padding: 12px;
}

.discount {
  position: absolute;
  top: 13px;
  right: 13px;
  z-index: 3;
  background: #ff4e38;
  color: white;
  padding: 6px 10px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 800;
}

.product-info {
  padding: 15px 16px 17px;
}

.product-title {
  font-size: 15px;
  line-height: 1.7;
  font-weight: 800;
  color: #29263c;
  margin-bottom: 10px;
}

.price-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 13px;
}

.current-price {
  display: flex;
  align-items: baseline;
  gap: 4px;
}

.price-number {
  font-size: 25px;
  font-weight: 900;
  color: #5b35d5;
}

.price-currency {
  font-size: 11px;
  font-weight: 800;
  color: #5b35d5;
}

.old-price {
  color: #aaa8b3;
  font-size: 12px;
  text-decoration: line-through;
}

.buy {
  width: 100%;
  min-height: 47px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: #12a87d;
  color: white;
  font-size: 13px;
  font-weight: 800;
  box-shadow: 0 7px 18px rgba(18,168,125,.18);
}


/* =========================
   EMPTY
========================= */

.empty {
  background: white;
  border: 1px solid #ebeaf1;
  border-radius: 20px;
  padding: 40px 20px;
  text-align: center;
}

.empty-icon {
  font-size: 38px;
}

.empty h3 {
  margin: 10px 0 0;
  font-size: 16px;
}

.empty p {
  margin: 7px 0 0;
  color: #92909e;
  font-size: 12px;
  line-height: 1.7;
}


/* =========================
   FOOTER
========================= */

.footer {
  text-align: center;
  padding: 28px 10px 10px;
  color: #aaa7b5;
  font-size: 10px;
}

.footer strong {
  color: #5b35d5;
}


/* =========================
   DESKTOP
========================= */

@media (min-width: 600px) {

  .categories {
    grid-template-columns: repeat(4, 1fr);
  }

  .category-image {
    height: 118px;
  }

  .product {
    max-width: 560px;
    margin: auto;
  }
}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 360px) {

  .container {
    padding-left: 12px;
    padding-right: 12px;
  }

  .categories {
    gap: 9px;
  }

  .category-image {
    height: 94px;
  }

  .category-bottom {
    min-height: 44px;
  }

  .product-image {
    height: 235px;
  }
}

</style>
</head>


<body>

<div class="app">


<!-- HEADER -->

<header class="header">

  <div class="header-content">

    <h1 class="brand">
      🔥 وَفِّرْهَا صَحّ 🔥
    </h1>

    <p class="tagline">
      لقيناها لك… ووفرنا عليك البحث 💜
    </p>

  </div>

</header>



<!-- HOME -->

<main id="homePage" class="page active">

<div class="container">


  <div class="section-heading">

    <h2>
      تسوّق حسب القسم
    </h2>

    <p>
      اختر القسم واكتشف أفضل المنتجات والعروض
    </p>

  </div>



  <div class="categories">


    <!-- SHOES -->

    <button class="category" onclick="showCategory('shoes')">

      <div class="category-image">
        <img src="shoes.jpg" alt="الأحذية">
      </div>

      <div class="category-bottom">

        <span class="category-name">
          الأحذية
        </span>

        <span class="category-arrow">
          ‹
        </span>

      </div>

    </button>



    <!-- DRESSES -->

    <button class="category" onclick="showCategory('dresses')">

      <div class="category-image">
        <img src="dresses.jpg" alt="الفساتين">
      </div>

      <div class="category-bottom">

        <span class="category-name">
          الفساتين
        </span>

        <span class="category-arrow">
          ‹
        </span>

      </div>

    </button>



    <!-- ACCESSORIES -->

    <button class="category" onclick="showCategory('accessories')">

      <div class="category-image">
        <img src="accessories.jpg" alt="الإكسسوارات">
      </div>

      <div class="category-bottom">

        <span class="category-name">
          الإكسسوارات
        </span>

        <span class="category-arrow">
          ‹
        </span>

      </div>

    </button>



    <!-- BAGS -->

    <button class="category" onclick="showCategory('bags')">

      <div class="category-image">
        <img src="bags.jpg" alt="الشنط">
      </div>

      <div class="category-bottom">

        <span class="category-name">
          الشنط
        </span>

        <span class="category-arrow">
          ‹
        </span>

      </div>

    </button>



    <!-- WATCHES -->

    <button class="category" onclick="showCategory('watches')">

      <div class="category-image">
        <img src="watches.jpg" alt="الساعات">
      </div>

      <div class="category-bottom">

        <span class="category-name">
          الساعات
        </span>

        <span class="category-arrow">
          ‹
        </span>

      </div>

    </button>



    <!-- ELECTRONICS -->

    <button class="category" onclick="showCategory('electronics')">

      <div class="category-image">
        <img src="electronics.jpg" alt="الإلكترونيات">
      </div>

      <div class="category-bottom">

        <span class="category-name">
          الإلكترونيات
        </span>

        <span class="category-arrow">
          ‹
        </span>

      </div>

    </button>



    <!-- HOME -->

    <button class="category" onclick="showCategory('home')">

      <div class="category-image">
        <img src="home.jpg" alt="المنزل">
      </div>

      <div class="category-bottom">

        <span class="category-name">
          المنزل
        </span>

        <span class="category-arrow">
          ‹
        </span>

      </div>

    </button>



    <!-- DEALS -->

    <button class="category" onclick="showCategory('deals')">

      <div class="category-image">
        <img src="deals.jpg" alt="أقوى العروض">
      </div>

      <div class="category-bottom">

        <span class="category-name">
          أقوى العروض
        </span>

        <span class="category-arrow">
          ‹
        </span>

      </div>

    </button>


  </div>



  <!-- DEALS BANNER -->

  <div
    class="deals-banner"
    onclick="showCategory('deals')"
  >

    <div class="deals-title">
      🔥 أقوى العروض
    </div>

    <div class="deals-text">
      عروض مختارة بأسعار تستاهل
    </div>

    <div class="deals-button">
      اكتشف الآن
    </div>

  </div>



  <div class="footer">

    <strong>
      وَفِّرْهَا صَحّ
    </strong>

    — لقيناها لك 🇸🇦

  </div>


</div>

</main>



<!-- PRODUCTS -->

<main id="productsPage" class="page">

<div class="container">


  <div class="products-header">

    <button
      class="back-button"
      onclick="goHome()"
    >
      →
    </button>


    <div class="products-heading">

      <h2 id="categoryTitle">
        المنتجات
      </h2>

      <p id="categorySubtitle">
        أفضل المنتجات المختارة لك
      </p>

    </div>

  </div>


  <div
    id="productsList"
    class="products-list"
  ></div>


  <div class="footer">

    <strong>
      وَفِّرْهَا صَحّ
    </strong>

    — عروض ومنتجات مختارة لك

  </div>


</div>

</main>

</div>



<script>

/* TELEGRAM */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

if (tg) {

  tg.ready();

  tg.expand();

  try {

    tg.setHeaderColor("#5b35d5");

    tg.setBackgroundColor("#f7f7fb");

  } catch (e) {}

}



/* PRODUCTS */

const products = {

  bags: [

    {
      title: "طقم حقائب نسائية مكون من 3 قطع",
      price: "4.36",
      old: "261.99",
      image: "النقاط.JPG",
      link: "https://temu.to/k/eygm0ev5vxz"
    }

  ],

  shoes: [],

  dresses: [],

  accessories: [],

  watches: [],

  electronics: [],

  home: [],

  deals: [

    {
      title: "طقم حقائب نسائية مكون من 3 قطع",
      price: "4.36",
      old: "261.99",
      image: "النقاط.JPG",
      link: "https://temu.to/k/eygm0ev5vxz"
    }

  ]

};



/* CATEGORY NAMES */

const categoryNames = {

  shoes: {
    title: "👟 الأحذية",
    subtitle: "أفضل الأحذية المختارة لك"
  },

  dresses: {
    title: "👗 الفساتين",
    subtitle: "فساتين مختارة بأسعار مميزة"
  },

  accessories: {
    title: "💍 الإكسسوارات",
    subtitle: "إكسسوارات تضيف لمستك"
  },

  bags: {
    title: "👜 الشنط",
    subtitle: "شنط مختارة بأسعار مميزة"
  },

  watches: {
    title: "⌚ الساعات",
    subtitle: "ساعات بتصاميم وأسعار مميزة"
  },

  electronics: {
    title: "📱 الإلكترونيات",
    subtitle: "منتجات إلكترونية تستاهل"
  },

  home: {
    title: "🏠 المنزل",
    subtitle: "منتجات مفيدة للمنزل"
  },

  deals: {
    title: "🔥 أقوى العروض",
    subtitle: "أفضل العروض التي لقيناها لك"
  }

};



/* SHOW CATEGORY */

function showCategory(category) {

  const home =
    document.getElementById("homePage");

  const productsPage =
    document.getElementById("productsPage");

  const list =
    document.getElementById("productsList");

  const title =
    document.getElementById("categoryTitle");

  const subtitle =
    document.getElementById("categorySubtitle");


  const info =
    categoryNames[category];

  const items =
    products[category] || [];


  home.classList.remove("active");

  productsPage.classList.add("active");


  title.textContent =
    info.title;

  subtitle.textContent =
    info.subtitle;


  list.innerHTML = "";


  /* EMPTY CATEGORY */

  if (!items.length) {

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🛍️
        </div>

        <h3>
          قريبًا!
        </h3>

        <p>
          نعمل على إضافة منتجات مميزة
          لهذا القسم.<br>
          تابعنا ليصلك كل جديد 🔥
        </p>

      </div>

    `;

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

    return;
  }


  /* PRODUCTS */

  items.forEach(product => {

    const article =
      document.createElement("article");

    article.className =
      "product";


    article.innerHTML = `

      <div class="product-image">

        <div class="discount">
          🔥 عرض مميز
        </div>

        <img
          src="${product.image}"
          alt="${escapeHtml(product.title)}"
          loading="lazy"
        >

      </div>


      <div class="product-info">

        <div class="product-title">
          ${escapeHtml(product.title)}
        </div>


        <div class="price-row">

          <div class="current-price">

            <span class="price-number">
              ${product.price}
            </span>

            <span class="price-currency">
              ر.س
            </span>

          </div>


          <div class="old-price">
            ${product.old} ر.س
          </div>

        </div>


        <a
          class="buy"
          href="${product.link}"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span>
            🛒
          </span>

          اشترِ الآن

        </a>

      </div>

    `;


    list.appendChild(article);

  });


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}



/* HOME */

function goHome() {

  document
    .getElementById("productsPage")
    .classList.remove("active");

  document
    .getElementById("homePage")
    .classList.add("active");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}



/* SECURITY */

function escapeHtml(value) {

  return String(value)

    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
