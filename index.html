<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>وَفِّرْهَا صَحّ</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Cairo Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >


  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Cairo", sans-serif;
      background: #f6f7fb;
      color: #171725;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    button,
    a {
      font-family: inherit;
    }

    button {
      border: none;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .top-header {

      position: relative;

      background:
        linear-gradient(
          135deg,
          #5b35d5 0%,
          #713fe2 55%,
          #8249e8 100%
        );

      color: #ffffff;

      padding: 23px 18px 27px;

      text-align: center;

      overflow: hidden;
    }

    .top-header::before {

      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      border-radius: 50%;

      background: rgba(255,255,255,0.08);

      top: -90px;
      right: -50px;
    }

    .top-header::after {

      content: "";

      position: absolute;

      width: 130px;
      height: 130px;

      border-radius: 50%;

      background: rgba(255,255,255,0.06);

      bottom: -70px;
      left: -30px;
    }

    .brand {

      position: relative;

      z-index: 2;

      font-size: 28px;

      font-weight: 900;

      letter-spacing: -0.5px;

      margin-bottom: 4px;
    }

    .brand-subtitle {

      position: relative;

      z-index: 2;

      font-size: 13px;

      font-weight: 500;

      opacity: 0.88;
    }


    /* =====================================================
       HOME
    ===================================================== */

    #home {
      display: block;
      padding-bottom: 30px;
    }


    /* =====================================================
       SECTION INTRO
    ===================================================== */

    .section-intro {

      max-width: 650px;

      margin: 0 auto;

      padding: 21px 18px 10px;

      text-align: center;
    }

    .section-title {

      font-size: 20px;

      font-weight: 800;

      color: #202033;
    }

    .section-description {

      margin-top: 2px;

      color: #858595;

      font-size: 13px;

      font-weight: 500;
    }


    /* =====================================================
       CATEGORIES
    ===================================================== */

    .categories {

      width: calc(100% - 28px);

      max-width: 650px;

      margin: 8px auto 0;

      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 12px;
    }


    /* =====================================================
       CATEGORY CARD
    ===================================================== */

    .category {

      position: relative;

      display: flex;

      align-items: center;

      gap: 10px;

      min-height: 76px;

      padding: 12px;

      background: #ffffff;

      border: 1px solid #ececf3;

      border-radius: 17px;

      color: #242434;

      cursor: pointer;

      text-align: right;

      box-shadow:
        0 5px 18px rgba(30, 30, 60, 0.055);

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }

    .category:active {

      transform: scale(.97);

      box-shadow:
        0 3px 10px rgba(30, 30, 60, .08);
    }

    .category-icon {

      width: 45px;
      height: 45px;

      min-width: 45px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 14px;

      font-size: 23px;

      background: #f1edff;
    }

    .category-name {

      font-size: 15px;

      font-weight: 800;

      line-height: 1.35;
    }

    .category-arrow {

      margin-right: auto;

      color: #aaaabd;

      font-size: 18px;

      font-weight: 700;
    }


    /* =====================================================
       DEALS BANNER
    ===================================================== */

    .deals-banner {

      position: relative;

      display: flex;

      align-items: center;

      justify-content: space-between;

      width: calc(100% - 28px);

      max-width: 650px;

      min-height: 86px;

      margin: 18px auto 0;

      padding: 15px 18px;

      border-radius: 19px;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #ff8a24,
          #ff5b35
        );

      color: #ffffff;

      cursor: pointer;

      box-shadow:
        0 10px 25px rgba(255, 100, 45, .20);
    }

    .deals-banner::before {

      content: "";

      position: absolute;

      width: 130px;
      height: 130px;

      border-radius: 50%;

      background: rgba(255,255,255,.10);

      left: -45px;
      bottom: -75px;
    }

    .deals-content {

      position: relative;

      z-index: 2;
    }

    .deals-small {

      font-size: 11px;

      font-weight: 700;

      opacity: .9;
    }

    .deals-title {

      font-size: 19px;

      font-weight: 900;

      margin-top: 1px;
    }

    .deals-icon {

      position: relative;

      z-index: 2;

      width: 49px;
      height: 49px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 15px;

      background: rgba(255,255,255,.18);

      font-size: 25px;
    }


    /* =====================================================
       PRODUCTS PAGE
    ===================================================== */

    #products {

      display: none;

      min-height: 100vh;

      padding-bottom: 35px;
    }

    #products.active {
      display: block;
    }


    /* =====================================================
       PRODUCTS HEADER
    ===================================================== */

    .products-header {

      display: flex;

      align-items: center;

      gap: 10px;

      max-width: 650px;

      margin: 0 auto;

      padding: 18px 16px 12px;
    }

    .back {

      width: 42px;
      height: 42px;

      min-width: 42px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background: #ffffff;

      color: #29293a;

      font-size: 21px;

      cursor: pointer;

      box-shadow:
        0 4px 14px rgba(30,30,60,.06);

      border: 1px solid #ededf3;
    }

    .products-title-wrap {
      flex: 1;
    }

    #categoryTitle {

      font-size: 21px;

      font-weight: 900;

      color: #202033;
    }

    .products-count {

      color: #9090a0;

      font-size: 11px;

      font-weight: 600;
    }


    /* =====================================================
       PRODUCT LIST
    ===================================================== */

    #productList {

      width: 100%;

      padding-top: 5px;
    }


    /* =====================================================
       PRODUCT CARD
    ===================================================== */

    .product {

      width: calc(100% - 32px);

      max-width: 390px;

      margin: 0 auto 22px;

      background: #ffffff;

      border-radius: 22px;

      overflow: hidden;

      border: 1px solid #ededf3;

      box-shadow:
        0 10px 30px rgba(32, 32, 65, 0.09);
    }


    /* =====================================================
       PRODUCT IMAGE
       الصورة الآن مربعة ومتصلة بالبطاقة
    ===================================================== */

   .product-image {
  position: relative;

  width: 100%;

  aspect-ratio: 1 / 1;

  display: flex;

  align-items: center;
  justify-content: center;

  background: #ffffff;

  overflow: hidden;
}

   .product-image img {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;

  padding: 0;
}


    /* =====================================================
       DISCOUNT BADGE
    ===================================================== */

    .discount {

      position: absolute;

      top: 13px;

      right: 13px;

      z-index: 3;

      padding: 5px 10px;

      border-radius: 9px;

      background: #ff5a54;

      color: #ffffff;

      font-size: 11px;

      font-weight: 800;

      box-shadow:
        0 3px 10px rgba(255,90,84,.20);
    }


    /* =====================================================
       PRODUCT INFO
    ===================================================== */

    .product-info {

      padding: 16px 17px 17px;

      background: #ffffff;
    }

    .product-title {

      color: #20202d;

      font-size: 17px;

      line-height: 1.6;

      font-weight: 800;

      margin-bottom: 10px;
    }


    /* =====================================================
       PRICE ROW
    ===================================================== */

    .price-row {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 13px;
    }

    .current-price {

      display: flex;

      align-items: baseline;

      gap: 4px;

      color: #e74747;
    }

    .price-number {

      font-size: 27px;

      line-height: 1;

      font-weight: 900;
    }

    .price-currency {

      font-size: 13px;

      font-weight: 800;
    }

    .old-price {

      color: #a1a1ad;

      font-size: 13px;

      font-weight: 600;

      text-decoration: line-through;
    }


    /* =====================================================
       BUY BUTTON
    ===================================================== */

    .buy {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 7px;

      width: 100%;

      min-height: 52px;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #18b58d,
          #0fa77f
        );

      color: #ffffff;

      text-decoration: none;

      font-size: 16px;

      font-weight: 900;

      box-shadow:
        0 7px 18px rgba(15, 167, 127, .17);

      transition:
        transform .15s ease;
    }

    .buy:active {
      transform: scale(.98);
    }

    .buy-icon {
      font-size: 19px;
    }


    /* =====================================================
       EMPTY CATEGORY
    ===================================================== */

    .empty {

      width: calc(100% - 28px);

      max-width: 390px;

      margin: 35px auto;

      padding: 35px 20px;

      text-align: center;

      background: #ffffff;

      border-radius: 20px;

      border: 1px solid #ededf3;

      box-shadow:
        0 7px 22px rgba(30,30,60,.06);
    }

    .empty-icon {

      font-size: 38px;

      margin-bottom: 10px;
    }

    .empty-title {

      color: #333344;

      font-size: 16px;

      font-weight: 800;
    }

    .empty-text {

      color: #9999a8;

      font-size: 12px;

      margin-top: 5px;
    }


    /* =====================================================
       DESKTOP
    ===================================================== */

    @media (min-width: 700px) {

      .categories {
        grid-template-columns: repeat(4, 1fr);
      }

      .category {
        min-height: 82px;
      }

      .product {
        max-width: 390px;
      }
    }


    /* =====================================================
       SMALL PHONES
    ===================================================== */

    @media (max-width: 380px) {

      .brand {
        font-size: 25px;
      }

      .category {
        min-height: 70px;
        padding: 10px;
      }

      .category-icon {

        width: 40px;
        height: 40px;

        min-width: 40px;

        font-size: 20px;
      }

      .category-name {
        font-size: 13px;
      }

      .product {
        width: calc(100% - 24px);
        border-radius: 19px;
      }

      .product-title {
        font-size: 16px;
      }

      .price-number {
        font-size: 25px;
      }

      .product-info {
        padding: 15px;
      }
    }

  </style>

</head>


<body>


  <!-- =====================================================
       HOME
  ===================================================== -->

  <div id="home">


    <!-- HEADER -->

    <header class="top-header">

      <div class="brand">
        🔥 وَفِّرْهَا صَحّ
      </div>

      <div class="brand-subtitle">
        عروض مختارة بعناية وأسعار تستاهل
      </div>

    </header>


    <!-- INTRO -->

    <section class="section-intro">

      <div class="section-title">
        ماذا تبحث عنه؟
      </div>

      <div class="section-description">
        اختر القسم وشاهد أفضل المنتجات
      </div>

    </section>


    <!-- CATEGORIES -->

    <div class="categories">


      <button
        class="category"
        onclick="showCategory('shoes')"
      >

        <span class="category-icon">
          👟
        </span>

        <span class="category-name">
          الأحذية
        </span>

        <span class="category-arrow">
          ‹
        </span>

      </button>


      <button
        class="category"
        onclick="showCategory('dresses')"
      >

        <span class="category-icon">
          👗
        </span>

        <span class="category-name">
          الفساتين
        </span>

        <span class="category-arrow">
          ‹
        </span>

      </button>


      <button
        class="category"
        onclick="showCategory('accessories')"
      >

        <span class="category-icon">
          💍
        </span>

        <span class="category-name">
          الإكسسوارات
        </span>

        <span class="category-arrow">
          ‹
        </span>

      </button>


      <button
        class="category"
        onclick="showCategory('bags')"
      >

        <span class="category-icon">
          👜
        </span>

        <span class="category-name">
          الشنط
        </span>

        <span class="category-arrow">
          ‹
        </span>

      </button>


      <button
        class="category"
        onclick="showCategory('watches')"
      >

        <span class="category-icon">
          ⌚
        </span>

        <span class="category-name">
          الساعات
        </span>

        <span class="category-arrow">
          ‹
        </span>

      </button>


      <button
        class="category"
        onclick="showCategory('electronics')"
      >

        <span class="category-icon">
          📱
        </span>

        <span class="category-name">
          الإلكترونيات
        </span>

        <span class="category-arrow">
          ‹
        </span>

      </button>


      <button
        class="category"
        onclick="showCategory('home')"
      >

        <span class="category-icon">
          🏠
        </span>

        <span class="category-name">
          المنزل
        </span>

        <span class="category-arrow">
          ‹
        </span>

      </button>


      <button
        class="category"
        onclick="showCategory('deals')"
      >

        <span
          class="category-icon"
          style="background:#fff1e8;"
        >
          🔥
        </span>

        <span class="category-name">
          أقوى العروض
        </span>

        <span class="category-arrow">
          ‹
        </span>

      </button>


    </div>


    <!-- DEALS BANNER -->

    <button
      class="deals-banner"
      onclick="showCategory('deals')"
    >

      <div class="deals-content">

        <div class="deals-small">
          لا تفوّت الفرصة
        </div>

        <div class="deals-title">
          🔥 أقوى العروض اليوم
        </div>

      </div>

      <div class="deals-icon">
        ⚡
      </div>

    </button>


  </div>



  <!-- =====================================================
       PRODUCTS
  ===================================================== -->

  <div id="products">


    <div class="products-header">


      <button
        class="back"
        onclick="goHome()"
        aria-label="رجوع"
      >
        →
      </button>


      <div class="products-title-wrap">

        <h2 id="categoryTitle">
        </h2>

        <div
          id="productsCount"
          class="products-count"
        >
        </div>

      </div>


    </div>


    <div id="productList">
    </div>


  </div>



  <!-- =====================================================
       JAVASCRIPT
  ===================================================== -->

  <script>


    /* =====================================================
       PRODUCTS
    ===================================================== */

    const products = {


      bags: [

        {

          title:
            "طقم حقائب نسائية مكون من 3 قطع",

          price:
            "4.36",

          old:
            "261.99",

          image:
            "التقاط.JPG",

          link:
            "https://temu.to/k/eygm0ev5vxz"

        }

      ],


      shoes: [],

      dresses: [],

      accessories: [],

      watches: [],

      electronics: [],

      home: [],

      deals: []

    };


    /* =====================================================
       CATEGORY NAMES
    ===================================================== */

    const categoryNames = {

      shoes:
        "👟 الأحذية",

      dresses:
        "👗 الفساتين",

      accessories:
        "💍 الإكسسوارات",

      bags:
        "👜 الشنط",

      watches:
        "⌚ الساعات",

      electronics:
        "📱 الإلكترونيات",

      home:
        "🏠 المنزل",

      deals:
        "🔥 أقوى العروض"

    };


    /* =====================================================
       SHOW CATEGORY
    ===================================================== */

    function showCategory(category) {


      document
        .getElementById("home")
        .style.display = "none";


      document
        .getElementById("products")
        .classList.add("active");


      document
        .getElementById("categoryTitle")
        .textContent =
        categoryNames[category];


      const items =
        products[category] || [];


      document
        .getElementById("productsCount")
        .textContent =
        items.length === 1
          ? "منتج واحد"
          : `${items.length} منتجات`;


      const productList =
        document.getElementById("productList");


      productList.innerHTML = "";


      /* =================================================
         EMPTY CATEGORY
      ================================================= */

      if (items.length === 0) {


        productList.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              🛍️
            </div>

            <div class="empty-title">
              لا توجد منتجات هنا حالياً
            </div>

            <div class="empty-text">
              نضيف منتجات وعروض جديدة باستمرار
            </div>

          </div>

        `;


        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });


        return;

      }


      /* =================================================
         PRODUCTS
      ================================================= */

      items.forEach(product => {


        productList.innerHTML += `

          <article class="product">


            <div class="product-image">


              <div class="discount">
                عرض مميز
              </div>


              <img
                src="${product.image}"
                alt="${product.title}"
              >


            </div>


            <div class="product-info">


              <div class="product-title">
                ${product.title}
              </div>


              <div class="price-row">


                <div class="current-price">

                  <span class="price-number">
                    ${product.price}
                  </span>

                  <span class="price-currency">
                    ر.س
                  </span>

                </div>


                <div class="old-price">
                  ${product.old} ر.س
                </div>


              </div>


              <a
                class="buy"
                href="${product.link}"
                target="_blank"
                rel="noopener noreferrer"
              >

                <span class="buy-icon">
                  🛒
                </span>

                اشترِ الآن

              </a>


            </div>


          </article>

        `;

      });


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =====================================================
       GO HOME
    ===================================================== */

    function goHome() {


      document
        .getElementById("products")
        .classList.remove("active");


      document
        .getElementById("home")
        .style.display = "block";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =====================================================
       TELEGRAM MINI APP
    ===================================================== */

    if (
      window.Telegram &&
      Telegram.WebApp
    ) {

      Telegram.WebApp.ready();

      Telegram.WebApp.expand();

    }


  </script
